version: 0.3
status: draft
site: agilemarketingsystems.com
purpose: component and conversion-learning contract for AWF/EmDash rendering

brand:
  optional:
    - logo_src
    - logo_alt
    - nav
    - header_cta
    - footer
  rules:
    - logo path must point to a verified bundled asset before production
    - do not hotlink legacy WordPress media in production
    - text brand fallback must render when no verified logo is configured
    - customer logos and proof assets require verification before use
  nav_item_schema:
    required:
      - label
      - href
  footer_schema:
    optional:
      - tagline
      - links
      - legal

components:
  site_header:
    required:
      - brand_identity
    optional:
      - nav
      - header_cta
      - mobile_menu
    rules:
      - structured from config
      - preserve CTA analytics event when supplied
      - mobile treatment must not cause horizontal overflow
      - no JavaScript dependency required for basic menu access

  hero:
    required:
      - eyebrow
      - headline
      - subhead
      - primary_cta
    optional:
      - secondary_cta
      - proof_strip
      - media
    experimentable_fields:
      - headline
      - subhead
      - primary_cta.label
      - secondary_cta.label
      - secondary_cta.enabled
      - proof_strip.position
    rules:
      - no unverified outcome claims
      - no invented pricing or guarantees

  problem_stack:
    required:
      - headline
      - problems
      - conclusion
    problems_min: 3
    problems_max: 8

  system_grid:
    required:
      - headline
      - modules
    module_schema:
      required:
        - id
        - title
        - summary
      optional:
        - icon
        - route
        - proof_ref

  niche_matrix:
    required:
      - headline
      - intro
      - niches
    niche_schema:
      required:
        - id
        - label
        - positioning
        - modules
      optional:
        - route
        - proof_refs
        - cta

  project_proof:
    required:
      - headline
      - intro
      - project_refs
    project_ref_schema:
      required:
        - id
        - service
        - market
        - problem
        - work_performed
        - result_summary
      optional:
        - photos
        - testimonial_ref
        - related_service_route
        - related_location_route

  process_steps:
    required:
      - headline
      - steps
    step_schema:
      required:
        - number
        - title
        - summary

  conversion_learning:
    required:
      - headline
      - body
      - cards
    card_schema:
      required:
        - title
        - body
    rules:
      - explain measurement and testing without inventing performance claims
      - primary business outcomes take precedence over vanity metrics
      - public copy must not imply a proven lift unless backed by verified experiment records

  technology_ownership:
    required:
      - headline
      - benefits
    prohibited_public_detail:
      - credentials
      - secrets
      - internal hostnames
      - unpublished infrastructure identifiers

  case_study_cards:
    required:
      - headline
      - case_study_refs
    case_study_ref_schema:
      required:
        - id
        - title
        - summary
      optional:
        - metric_refs
        - project_refs
        - route

  faq:
    required:
      - items
    item_schema:
      required:
        - question
        - answer

  cta_band:
    required:
      - headline
      - body
      - primary_cta
    optional:
      - secondary_cta

  site_footer:
    required:
      - company_name
    optional:
      - tagline
      - links
      - legal
    rules:
      - structured from config
      - legal text must not imply unverified business claims

cta_schema:
  required:
    - label
    - href
    - event
  allowed_events:
    - view_system
    - view_niche
    - view_project
    - view_case_study
    - start_intake
    - book_strategy_call
    - submit_lead
    - view_demo
    - form_start
    - form_complete
    - cta_header_get_started
    - cta_hero_get_started
    - cta_hero_explore_system
    - cta_footer_build_growth_plan

experiments:
  purpose: controlled conversion learning without changing verified business truth
  experiment_schema:
    required:
      - id
      - route
      - component
      - objective
      - hypothesis
      - primary_metric
      - variants
      - status
    optional:
      - secondary_metrics
      - owner
      - start_at
      - end_at
      - winner
      - promotion_status
      - minimum_sample
    variant_schema:
      required:
        - id
        - weight
        - fields
    allowed_initial_components:
      - hero
      - faq
      - cta_band
      - project_proof
      - get_started_flow
    preferred_primary_metrics:
      - revenue
      - closed_job
      - qualified_lead
      - booked_call
      - completed_intake
      - qualified_phone_call
    allowed_secondary_metrics:
      - cta_click
      - secondary_cta_click
      - demo_engagement
      - form_start
      - route_progression
      - scroll_depth
      - engagement_time
      - bounce
    locked_during_experiments:
      - pricing
      - guarantees
      - customer_names
      - testimonials
      - project_outcomes
      - case_study_metrics
      - licenses
      - certifications
      - service_areas
      - business_addresses
      - phone_numbers
      - regulatory_claims
      - financing_terms
      - factual_service_capabilities
    rules:
      - primary business metric takes precedence over supporting engagement metrics
      - experiment may resolve as inconclusive
      - no automatic public performance claim from an experiment result
      - winner promotion back to canonical config requires an auditable approval step
      - no autonomous production traffic split in current implementation

content_policy:
  allowed_agentic_actions:
    - assemble approved components
    - adapt approved copy by niche
    - select verified proof by reference
    - generate controlled service and location variants
    - refresh copy from approved structured facts
    - propose controlled experiment variants for approved experimentable fields
    - summarize experiment evidence without converting it into an unverified public claim
  prohibited_agentic_actions:
    - invent pricing
    - invent guarantees
    - invent customer results
    - invent licenses
    - invent service areas
    - invent reviews
    - invent case study outcomes
    - invent regulatory claims
    - declare an experiment winner without configured evidence requirements
    - auto-promote a winner to production without approval

validation:
  fail_if:
    - placeholder_content_present
    - required_component_field_missing
    - unverified_claim_present
    - dead_internal_link
    - missing_primary_cta
    - missing_canonical
    - duplicate_title
    - experiment_changes_locked_fact
    - experiment_missing_primary_metric
  warning_if:
    - no_project_proof
    - no_case_study_proof
    - no_secondary_cta
    - no_schema_markup
    - logo_asset_not_yet_verified
    - experiment_has_no_minimum_sample
