version: 0.4
status: draft
site: agilemarketingsystems.com
purpose: component, throughput, constraint, and conversion-learning contract for AWF/EmDash rendering

optimization_model:
  top_level_objective: profitable_completed_jobs_per_period
  operating_loop:
    - build
    - measure
    - diagnose_constraint
    - exploit_constraint
    - test_when_useful
    - improve_throughput
    - find_next_constraint
    - repeat
  rule: conversion testing is subordinate to diagnosed contractor throughput constraints

throughput_chain:
  - demand
  - visibility
  - trust
  - lead_capture
  - speed_to_lead
  - appointment
  - estimate
  - close
  - completed_job
  - review_referral_repeat

constraint_model:
  allowed_categories:
    - market
    - visibility
    - trust
    - conversion
    - response
    - appointment
    - estimate
    - sales
    - capacity
    - reputation
    - follow_up
    - leadership_process
  statuses:
    - candidate
    - diagnosing
    - active
    - being_exploited
    - testing_intervention
    - relieved
    - superseded
    - inconclusive
  schema:
    required:
      - id
      - category
      - stage
      - status
      - hypothesis
      - evidence
      - throughput_metric
      - interventions
    optional:
      - confidence
      - owner
      - first_observed_at
      - last_evaluated_at
      - supporting_metrics
      - protected_facts
      - supersedes_constraint_id
      - relieved_by_intervention_id
  rules:
    - normally designate one primary active constraint per operating period
    - diagnose before prescribing upstream demand expansion
    - exploit the active constraint before expanding load upstream
    - re-diagnose after material throughput improvement because the constraint may move

capacity_model:
  schema:
    required:
      - demand_pressure
    optional:
      - current_completed_jobs
      - estimated_sustainable_capacity
      - period
      - source
      - confidence
      - suppress_demand_expansion
  demand_pressure_states:
    - underutilized
    - balanced
    - near_capacity
    - over_capacity
    - unknown
  rules:
    - when near_capacity or over_capacity, demand expansion must not be the default recommendation
    - capacity may begin as operator or intake supplied data

throughput_metrics:
  preferred_primary_metrics:
    - profitable_completed_job
    - revenue
    - closed_job
    - qualified_lead
    - booked_appointment
    - completed_intake
    - qualified_phone_call
  allowed_constraint_metrics:
    - qualified_lead_rate
    - answered_qualified_lead_rate
    - lead_response_rate
    - median_speed_to_lead
    - appointment_set_rate
    - estimate_issued_rate
    - close_rate
    - completed_job_rate
    - capacity_utilization
    - review_request_completion_rate
  supporting_metrics:
    - cta_click
    - secondary_cta_click
    - demo_engagement
    - form_start
    - route_progression
    - project_page_engagement
    - scroll_depth
    - engagement_time
    - bounce
  rules:
    - use the deepest reliable downstream business outcome available
    - supporting metrics cannot independently define success when downstream outcome data exists
    - increased CTR is not a win if qualified jobs or downstream outcomes decline

brand:
  optional:
    - logo_src
    - logo_alt
    - nav
    - header_cta
    - footer
  rules:
    - logo path must point to a verified bundled asset before production
    - do not hotlink legacy WordPress media in production
    - text brand fallback must render when no verified logo is configured
    - customer logos and proof assets require verification before use
  nav_item_schema:
    required:
      - label
      - href
  footer_schema:
    optional:
      - tagline
      - links
      - legal

components:
  site_header:
    required:
      - brand_identity
    optional:
      - nav
      - header_cta
      - mobile_menu
    rules:
      - structured from config
      - preserve CTA analytics event when supplied
      - mobile treatment must not cause horizontal overflow
      - no JavaScript dependency required for basic menu access

  hero:
    required:
      - eyebrow
      - headline
      - subhead
      - primary_cta
    optional:
      - secondary_cta
      - proof_strip
      - media
    experimentable_fields:
      - headline
      - subhead
      - primary_cta.label
      - secondary_cta.label
      - secondary_cta.enabled
      - proof_strip.position
    rules:
      - no unverified outcome claims
      - no invented pricing or guarantees

  problem_stack:
    required:
      - headline
      - problems
      - conclusion
    problems_min: 3
    problems_max: 8

  system_grid:
    required:
      - headline
      - modules
    module_schema:
      required:
        - id
        - title
        - summary
      optional:
        - icon
        - route
        - proof_ref

  niche_matrix:
    required:
      - headline
      - intro
      - niches
    niche_schema:
      required:
        - id
        - label
        - positioning
        - modules
      optional:
        - route
        - proof_refs
        - cta

  contractor_constraint_audit:
    required:
      - headline
      - categories
      - output_model
    allowed_categories:
      - demand
      - visibility
      - trust
      - conversion
      - response
      - sales
      - follow_up
      - reputation
      - capacity
    output_model:
      required:
        - primary_constraint
        - evidence
        - recommended_intervention
        - primary_metric
    rules:
      - public copy must frame the audit as diagnosis, not a guarantee
      - do not claim traffic is the constraint without evidence

  project_proof:
    required:
      - headline
      - intro
      - project_refs
    project_ref_schema:
      required:
        - id
        - service
        - market
        - problem
        - work_performed
        - result_summary
      optional:
        - photos
        - testimonial_ref
        - related_service_route
        - related_location_route

  process_steps:
    required:
      - headline
      - steps
    step_schema:
      required:
        - number
        - title
        - summary

  conversion_learning:
    required:
      - headline
      - body
      - cards
    card_schema:
      required:
        - title
        - body
    rules:
      - conversion testing is a constraint-relief tool, not the top-level optimization model
      - explain measurement and testing without inventing performance claims
      - primary business outcomes take precedence over vanity metrics
      - public copy must not imply a proven lift unless backed by verified experiment records

  technology_ownership:
    required:
      - headline
      - benefits
    prohibited_public_detail:
      - credentials
      - secrets
      - internal hostnames
      - unpublished infrastructure identifiers

  case_study_cards:
    required:
      - headline
      - case_study_refs
    case_study_ref_schema:
      required:
        - id
        - title
        - summary
      optional:
        - metric_refs
        - project_refs
        - route

  faq:
    required:
      - items
    item_schema:
      required:
        - question
        - answer

  cta_band:
    required:
      - headline
      - body
      - primary_cta
    optional:
      - secondary_cta

  site_footer:
    required:
      - company_name
    optional:
      - tagline
      - links
      - legal
    rules:
      - structured from config
      - legal text must not imply unverified business claims

cta_schema:
  required:
    - label
    - href
    - event
  allowed_events:
    - view_system
    - view_niche
    - view_project
    - view_case_study
    - start_constraint_audit
    - start_intake
    - book_strategy_call
    - submit_lead
    - view_demo
    - form_start
    - form_complete
    - cta_header_get_started
    - cta_hero_get_started
    - cta_hero_explore_system
    - cta_footer_build_growth_plan

experiments:
  purpose: controlled constraint-relief testing without changing verified business truth
  experiment_schema:
    required:
      - id
      - route
      - component
      - objective
      - hypothesis
      - primary_metric
      - variants
      - status
    optional:
      - constraint_id
      - secondary_metrics
      - owner
      - start_at
      - end_at
      - winner
      - promotion_status
      - minimum_sample
      - evidence_requirements
    rules:
      - constraint_id is strongly preferred and required for managed optimization unless explicitly waived
      - random experimentation is discouraged
      - primary business metric takes precedence over supporting engagement metrics
      - experiment may resolve as inconclusive
      - no automatic public performance claim from an experiment result
      - winner promotion back to canonical config requires an auditable approval step
      - no autonomous production traffic split in current implementation
  variant_schema:
    required:
      - id
      - weight
      - fields
  allowed_initial_components:
    - hero
    - faq
    - cta_band
    - project_proof
    - get_started_flow
  locked_during_experiments:
    - pricing
    - guarantees
    - customer_names
    - testimonials
    - project_outcomes
    - case_study_metrics
    - licenses
    - certifications
    - service_areas
    - business_addresses
    - phone_numbers
    - regulatory_claims
    - financing_terms
    - factual_service_capabilities

client_qualification:
  dimensions:
    - viable_service_economics
    - identifiable_market_opportunity
    - measurable_funnel_stages
    - integration_willingness
    - proof_availability_or_buildability
    - operational_willingness
    - current_or_expandable_capacity
    - decision_maker_participation
    - sufficient_lead_or_job_value
  rule: needing a website alone does not establish managed-service fit

content_policy:
  allowed_agentic_actions:
    - assemble approved components
    - adapt approved copy by niche
    - select verified proof by reference
    - generate controlled service and location variants
    - refresh copy from approved structured facts
    - propose candidate constraints from verified evidence
    - propose smallest useful intervention for the active constraint
    - propose controlled experiment variants for approved experimentable fields
    - summarize experiment evidence without converting it into an unverified public claim
  prohibited_agentic_actions:
    - invent pricing
    - invent guarantees
    - invent customer results
    - invent licenses
    - invent service areas
    - invent reviews
    - invent case study outcomes
    - invent regulatory claims
    - assume traffic is the constraint without evidence
    - declare an experiment winner without configured evidence requirements
    - auto-promote a winner to production without approval
    - autonomously change CRM routing, sales process, capacity commitments, or production offer

validation:
  fail_if:
    - placeholder_content_present
    - required_component_field_missing
    - unverified_claim_present
    - dead_internal_link
    - missing_primary_cta
    - missing_canonical
    - duplicate_title
    - experiment_changes_locked_fact
    - experiment_missing_primary_metric
    - experiment_declares_winner_from_supporting_metric_only
    - demand_expansion_recommended_while_capacity_gate_suppresses_it
  warning_if:
    - no_project_proof
    - no_case_study_proof
    - no_secondary_cta
    - no_schema_markup
    - logo_asset_not_yet_verified
    - experiment_has_no_minimum_sample
    - active_constraint_has_low_confidence
    - capacity_state_unknown
