version: 0.5
status: draft
site: agilemarketingsystems.com
purpose: route contract for the multi-page Agile V2 flagship

routes:
  - path: /
    type: homepage
    source: __tests__/fixtures/agile-v2-homepage.json
    status: renderable

  - path: /system/
    type: product_system
    intent: explain the connected AI Website & Growth System and contractor throughput model
    primary_cta: /growth-constraint-audit/
    status: renderable

  - path: /ai-websites/
    type: capability
    intent: explain the contractor AI website layer and Website Factory model
    primary_cta: /growth-constraint-audit/
    status: renderable

  - path: /local-seo/
    type: capability
    intent: explain local-search architecture as one possible intervention when visibility is the active constraint
    primary_cta: /growth-constraint-audit/
    status: renderable

  - path: /conversion-learning/
    type: capability
    intent: explain controlled testing as a subordinate constraint-relief tool
    primary_cta: /growth-constraint-audit/
    status: renderable

  - path: /growth-constraint-audit/
    type: diagnostic_conversion
    intent: identify the most likely bottleneck limiting profitable completed jobs
    form_policy: no_placeholder_endpoint_in_production
    status: planned

  - path: /projects/
    type: proof_index
    intent: index verified project/proof content only
    data_policy: hide_empty_state_or_show_explanatory_nonproof_copy
    status: planned

  - path: /case-studies/
    type: proof_index
    intent: publish verified case studies only
    data_policy: no_invented_metrics_or_results
    status: planned

  - path: /contractors/
    type: niche_index
    intent: route visitors into contractor-specific system configurations
    status: renderable

  - path: /contractors/restoration/
    type: niche_landing
    niche: restoration
    status: renderable

  - path: /contractors/roofing/
    type: niche_landing
    niche: roofing
    status: renderable

  - path: /contractors/foundation-repair/
    type: niche_landing
    niche: foundation_repair
    status: renderable

  - path: /contractors/garage-doors/
    type: niche_landing
    niche: garage_doors
    status: renderable

  - path: /contractors/epoxy-flooring/
    type: niche_landing
    niche: epoxy_flooring
    status: renderable

  - path: /about/
    type: company
    intent: explain Agile Marketing Systems Inc., operating philosophy and delivery model
    status: planned

  - path: /get-started/
    type: conversion
    intent: contractor growth-system intake and strategy-call path
    form_policy: no_placeholder_endpoint_in_production
    status: renderable

route_rules:
  - every public route must emit unique title and meta description
  - every public route must emit a canonical URL
  - every internal navigation href must resolve to a rendered route before production cutover
  - proof routes may only use verified structured source records
  - no route may introduce invented pricing, guarantees, reviews, licenses, service areas or results
  - conversion-learning routes may explain process but may not claim a conversion lift without verified experiment evidence
  - public growth recommendations must follow diagnose-before-prescribe and exploit-before-expand rules
  - demand expansion must not be positioned as the default when capacity or downstream leakage is the active constraint
  - route output must remain exportable static HTML unless an approved runtime feature requires otherwise
  - production routes default to indexable; preview/staging output must remain noindex
  - legacy WordPress URLs require explicit preserve/rewrite/redirect/retire decisions before cutover

implementation_sequence:
  - /get-started/
  - /system/
  - /contractors/
  - /ai-websites/
  - /local-seo/
  - /conversion-learning/
  - /contractors/restoration/
  - /contractors/roofing/
  - /contractors/foundation-repair/
  - /contractors/garage-doors/
  - /contractors/epoxy-flooring/
  - /growth-constraint-audit/
  - /projects/
  - /case-studies/
  - /about/

implementation_checkpoint:
  route_fixture: __tests__/fixtures/agile-v2-site-routes.json
  rendered_non_homepage_routes: 11
  remaining_planned_routes:
    - /growth-constraint-audit/
    - /projects/
    - /case-studies/
    - /about/

validation:
  fail_if:
    - dead_internal_link
    - duplicate_title
    - missing_canonical
    - missing_primary_cta_on_conversion_route
    - unverified_proof_record
    - unverified_conversion_claim
    - placeholder_content_present
    - demand_expansion_recommended_when_capacity_gate_suppresses_it
  warning_if:
    - proof_index_has_no_verified_records
    - route_has_no_contextual_internal_links
    - growth_constraint_audit_endpoint_not_configured
    - capacity_state_unknown
