name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Test suite
        run: npm test -- --runInBand

      - name: Build Agile V2 preview
        run: npm run preview:agile-v2

      - name: Upload Agile V2 preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: agile-v2-preview
          path: outputs/agile-v2-preview/
          if-no-files-found: error
          retention-days: 14
